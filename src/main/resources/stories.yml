# ---------------------------------------------------------------
#  stories.yml - every entry is one visit from Lyra.
#
#  title:    name of the story (window title)
#  pages:    what she says, one list entry per page.
#            Keep each page under about 300 characters so it fits the tooltip.
#  guide:    optional step-by-step help (opened with the Guidance button).
#            Keep it to about 6 short steps.
#  rewards:  optional console commands, run ONCE per player when they press Finish.
#
#  Placeholders: %player%
#  Formatting:   MiniMessage. Keep tags inside one page line.
#
#  Send a story from anywhere (console, Quests, DeluxeMenus, your own plugins):
#     story send <player|all> <story_id>
# ---------------------------------------------------------------

stories:
  welcome:
    title: "<gold>A New Chapter Begins"
    pages:
      - "Welcome, <yellow>%player%</yellow>. I am Lyra, keeper of this realm's chronicle. Every great deed here is written down, and today your own page begins."
      - "This world runs on machines and ingenuity. Gather resources, build your base and craft Slimefun machines to make your work easier."
      - "Whenever something important happens I will find you and tell you what it means. Press Finish to claim a small gift for the road."
    guide:
      - "Use <yellow>/sf guide</yellow> to get the Slimefun Guide. It lists every item and recipe."
      - "Switch servers with <yellow>/server lobby</yellow> and <yellow>/server survival</yellow>."
      - "Reread any story you have heard with <yellow>/story</yellow>."
    rewards:
      - "give %player% bread 8"

  slimefun_start:
    title: "<aqua>Your First Machine"
    pages:
      - "Machines do the boring work for you, %player%. Start small: one good tool is worth more than a dozen hurried ones."
      - "The Slimefun Guide shows every recipe. Open it, search for an item, and it shows exactly what you need to craft it."
    guide:
      - "Get the guide with <yellow>/sf guide</yellow> and right-click it to open."
      - "Use the search button in the guide to find any item by name."
      - "Craft the Enhanced Crafting Table early; many recipes need it."
      - "Some items must be unlocked with a research, which can cost experience levels."

  season_machine_awakens:
    title: "<light_purple>Chapter I: The Ancient Machine Awakens"
    pages:
      - "Listen closely, %player%. Deep beneath the world, something old has begun to hum. The Ancient Machine is waking, and it is hungry."
      - "It feeds on the work of every builder and miner here. No single hand can wake it; only all of us together."
      - "Each resource you gather and every machine you build brings the dawn closer. When the goal is reached, the realm itself will change."
    guide:
      - "Keep mining, crafting and building. Your effort counts toward the shared goal."
      - "Check the lobby board to see how close the server is to the target."
      - "The players who help the most are remembered in the chronicle."

  rank_up:
    title: "<green>A Rising Star"
    pages:
      - "Word has spread, %player%. Your deeds have not gone unnoticed, and the realm grants you a new standing."
      - "Wear it proudly. Great things are expected of you."
