name: ServerGuide
version: 1.0.0
main: dev.serverguide.ServerGuidePlugin
api-version: '26.1'
description: Step-by-step server tutorial with a guide NPC, dialog boxes and skip buttons.
softdepend: [ItemsAdder]
commands:
  guide:
    description: Open or control the server guide
    usage: /guide [start|next|back|skip|reload|reset <player>]
permissions:
  serverguide.use:
    default: true
  serverguide.admin:
    default: op
